<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #3e7d2e; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #3e7d2e; outline: none; }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: repeating-linear-gradient(180deg, #54a03e 0 64px, #4c9437 64px 128px);
        font: 800 15px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; letter-spacing: .12em;
      }
      #title { font-size: 46px; letter-spacing: .02em; text-align: center; line-height: .95; text-shadow: 0 4px 0 #14141c; }
      #title span { color: #ffd23f; display: block; }
      #bar { width: 60%; max-width: 240px; height: 14px; background: rgba(0, 0, 0, .35); border: 3px solid #14141c; }
      #fill { height: 100%; width: 0; background: #ffd23f; transition: width .15s; }
      #message { max-width: 80%; text-align: center; letter-spacing: .04em; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div id="title">LONG<span>SHOT</span></div>
      <div id="bar"><div id="fill"></div></div>
      <div id="message">LOADING</div>
    </div>
    <script>
      var canvas = document.getElementById("unity-canvas");
      var loading = document.getElementById("loading");
      var fill = document.getElementById("fill");
      var script = document.createElement("script");
      script.src = "Build/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, {
          arguments: [],
          dataUrl: "Build/{{{ DATA_FILENAME }}}",
          frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
          workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
          codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
          symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
          streamingAssetsUrl: "StreamingAssets",
          companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
          productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
          productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
          // Cap the render resolution so phones with very dense screens stay smooth.
          devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        }, function (progress) {
          fill.style.width = Math.round(progress * 100) + "%";
        }).then(function (instance) {
          window.unityInstance = instance;
          loading.remove();
          canvas.focus();
        }).catch(function (message) {
          document.getElementById("message").textContent = "THE GAME COULDN'T START: " + message;
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
